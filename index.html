<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diamond Loading Bar</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ffffff;
    overflow:hidden;
}

.loader-wrapper{
    width:900px;
    position:relative;
}

.diamond{
    position:absolute;
    top:-105px;
    left:60%;
    width:95px;

    animation:spin 2s linear infinite;

    filter:drop-shadow(0 0 18px #00bfff);
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

.loading-track{
    width:100%;
    height:24px;
    background:#111;
    border-radius:999px;
    overflow:hidden;
    position:relative;

    box-shadow:
    inset 0 0 10px rgba(0,0,0,0.5),
    0 0 15px rgba(0,0,0,0.15);
}

.loading-fill{
    width:65%;
    height:100%;
    border-radius:999px;

    background:linear-gradient(
    90deg,
    #00bfff,
    #67e8ff,
    #009dff
    );

    box-shadow:
    0 0 15px #00cfff,
    0 0 35px #00cfff;
}

</style>
</head>
<body>

<div class="loader-wrapper">

    <img
    class="diamond"
    src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png"
    alt="diamond"
    >

    <div class="loading-track">
        <div class="loading-fill"></div>
    </div>

</div>

</body>
</html>
